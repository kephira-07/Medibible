# Blueprint Render. Ce fichier avait déjà existé et a été supprimé par erreur
# le 2026-09-22 (commit 98dbb42) — alors que le service, lui, est resté
# « Blueprint managed » côté Render. Le restaurer n'est donc pas un ajout :
# c'est remettre en place la source de vérité dont le service dépend.
#
# Un seul service web sert l'API *et* le client : server/src/app.js monte
# `express.static(../../client/dist)`. Client et API partagent ainsi la même
# origine, ce qui évite un aller-retour cross-origin (DNS + TLS vers un 2e
# domaine) à chaque requête et à chaque connexion temps réel — beaucoup plus
# fragile sur une connexion mobile faible. Ne PAS définir VITE_API_URL ici :
# son absence fait que le client appelle '/api' en chemin relatif, donc la
# même origine que la page elle-même.

services:
  - type: web
    name: medibible
    runtime: node
    plan: free
    rootDir: server

    # Le déclencheur. Sans branche explicite, un service peut rester accroché
    # à une branche oubliée — il y a 4 branches `agents/*` sur ce dépôt, toutes
    # figées depuis août.
    branch: master
    autoDeploy: true

    # `--include=dev` n'est PAS cosmétique : Render exécute le build avec
    # NODE_ENV=production, et dans ce mode `npm install` ignore les
    # devDependencies. Or `@vitejs/plugin-react`, importé par
    # client/vite.config.js, en est une. Sans ce drapeau le build casse sur
    # « Cannot find package '@vitejs/plugin-react' » — et de façon trompeuse,
    # car `vite` lui-même reste installé (il arrive en dépendance transitive
    # de `@tailwindcss/vite`, qui est en dependencies). Vérifié en rejouant le
    # build à l'identique sur un clone propre.
    #
    # Ce build est aussi ce qui produit `client/dist`, qui est gitignoré donc
    # jamais présent dans le dépôt : si cette étape saute, le serveur redémarre
    # sur un dist périmé *sans que le déploiement échoue*.
    buildCommand: npm install --include=dev --prefix ../client && npm run build --prefix ../client && npm install
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      # Vite 8 et React 19 exigent un Node récent. Sans cette variable, Render
      # garde la version par défaut du jour où le service a été créé, qui
      # vieillit toute seule.
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # validateEnv() (server/src/config/env.js) refuse de démarrer en
      # production si CLIENT_URL manque — on la fixe donc ici plutôt que de
      # dépendre du dashboard. Elle doit désigner l'origine qui sert réellement
      # le client, c'est-à-dire ce service lui-même : elle alimente la liste
      # CORS partagée par l'API REST et Socket.IO.
      - key: CLIENT_URL
        value: https://medibible-api.onrender.com

      # `sync: false` = valeur saisie dans le dashboard, jamais écrite ici.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
