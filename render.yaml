# Un seul service : le serveur Express sert lui-même le client buildé
# (voir server/src/app.js, `clientBuildExists`) — client et API partagent
# donc le même domaine. Avant, ce fichier définissait deux services séparés
# (API + site statique sur deux domaines onrender.com différents), ce qui
# ajoutait un aller-retour réseau cross-origin supplémentaire (DNS + TLS vers
# un 2e domaine) à chaque requête et connexion temps réel — beaucoup plus
# fragile sur une connexion mobile faible. Ne PAS définir VITE_API_URL ici :
# son absence fait que le client appelle '/api' en chemin relatif, donc la
# même origine que la page elle-même.
services:
  - type: web
    name: medibible
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --prefix ../client && npm run build --prefix ../client && npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
